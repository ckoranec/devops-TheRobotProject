<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXX Byte - Contact Us</title>
    <link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="site-navigation.css?v=34">
</head>
<body>
    <header class="maxx-site-header"><h1>MAXX Bytes</h1><nav aria-label="Main navigation"><ul><li><a href="index.html#home">Home</a></li><li><a href="login.html">Login</a></li><li><a href="coupon-wallet.html">My coupons</a></li><li><a href="menu.html#menu">Menu</a></li><li><a href="order.html#order">Order</a></li><li><a href="tracking.html">Track Delivery</a></li><li><a href="about.html#about">About MAXX Bytes</a></li><li><a href="contact.html#contact">Contact Us</a></li></ul></nav></header>
    <main>
        <section id="contact" class="card">
            <h2>Contact Us</h2>
            <p>Get in touch with us for any queries or feedback.</p>
            <form id="contact-form" action="/api/contact" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                
                <button type="submit" id="contact-submit">Send Message</button>
                <p id="contact-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 MAXX Byte. All rights reserved.</p>
    </footer>

    <script>
    document.getElementById("contact-form").addEventListener("submit", async function (event) {
        event.preventDefault();

        const form = event.currentTarget;
        const button = document.getElementById("contact-submit");
        const status = document.getElementById("contact-status");

        const payload = {
            name: form.elements.name.value.trim(),
            email: form.elements.email.value.trim(),
            message: form.elements.message.value.trim()
        };

        button.disabled = true;
        status.textContent = "Sending your message...";

        try {
            const response = await fetch("/api/contact", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Submission failed.");
            }

            status.textContent =
                "Message received successfully. Reference #" + result.submission_id;
            form.reset();
        } catch (error) {
            status.textContent = error.message || "Unable to send message.";
        } finally {
            button.disabled = false;
        }
    });
    </script>

<script src="customer-navigation.js?v=34"></script>
</body>
</html>
