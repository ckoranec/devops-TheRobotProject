        <div class="dashboard-container">

            <!-- Interactive GMU campus map: Overpass GIS overlay -->
            <div class="data-card">
                <h3>Interactive GMU Campus Map</h3>
                <p>OpenStreetMap basemap with locally stored Overpass API data.</p>
                <div id="gmu-campus-map" style="height:700px;width:100%;border-radius:10px;" role="region" aria-label="Interactive George Mason University campus map"></div>
                <p id="gmu-map-status" aria-live="polite">Loading campus GIS data...</p>
            </div>
            </div>

    <!-- Leaflet displays OpenStreetMap tiles and Overpass road geometry. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    "use strict";

    // Start near George Mason University's Fairfax campus.
    const campusMap = L.map("gmu-campus-map").setView([38.8308, -77.3075], 16);

    // Basemap imagery is supplied by OpenStreetMap contributors.
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(campusMap);

    // Load the Overpass JSON already verified in the browser.
    fetch("data/gmu_map.json")
        .then(response => {
            if (!response.ok) throw new Error("GIS HTTP " + response.status);
            return response.json();
        })
        .then(data => {
            window.maxByteBuildLayers(campusMap, data);
            return;
            const lines = [];

            for (const element of data.elements || []) {
                if (element.type !== "way" || !Array.isArray(element.geometry)) continue;

                const coordinates = element.geometry
                    .filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lon))
                    .map(point => [point.lat, point.lon]);

                if (coordinates.length < 2) continue;

                const isFootway = element.tags?.highway === "footway";
                const line = L.polyline(coordinates, {
                    color: isFootway ? "#16a34a" : "#ff6b6b",
                    weight: 5
                }).addTo(campusMap);

                line.bindPopup(element.tags?.name || (isFootway ? "Campus footway" : "Campus road"));
                lines.push(line);
            }

            if (lines.length) {
                campusMap.fitBounds(L.featureGroup(lines).getBounds(), {
                    padding: [35, 35],
                    maxZoom: 17
                });
            }

            document.getElementById("gmu-map-status").textContent =
                "Loaded " + lines.length + " GIS ways. Red = road; green = footway.";
        })
        .catch(error => {
            document.getElementById("gmu-map-status").textContent =
                "Unable to load campus GIS data: " + error.message;
            console.error("GMU GIS loading error:", error);
        });
    </script>
